<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>AquesTalk1 recovered — wasm demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2em auto; padding: 0 1em; }
  textarea { width: 100%; height: 6em; font-size: 1.1em; }
  .row { display: flex; gap: 1em; align-items: center; margin: .8em 0; }
  button { padding: .4em 1.2em; font-size: 1em; }
  #log { color: #555; font-size: .9em; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>AquesTalk1 recovered — 原生 wasm</h1>
<p>9 声库（f1 f2 m1 m2 r1 imd1 jgr dvd + f3），8000 Hz / 16 bit / mono。</p>
<div class="row">
  <label>声库 <select id="voice"></select></label>
  <label>速度 <input id="speed" type="range" min="50" max="300" step="10" value="100">
    <span id="speedv">100%</span></label>
</div>
<textarea id="text">こんにちは、ごーせー/お'んせーです。</textarea>
<div class="row">
  <button id="synth">合成</button>
  <button id="save" disabled>下载 WAV</button>
</div>
<audio id="audio" controls></audio>
<div id="log"></div>
<script type="module">
import { AquesTalk1 } from './aquestalk1.js';

const aq = await AquesTalk1.load('./aquestalk1.wasm');
const sel = document.getElementById('voice');
for (const name of aq.voices()) {
  const o = document.createElement('option');
  o.value = o.textContent = name;
  sel.appendChild(o);
}
sel.value = 'f1';
const speed = document.getElementById('speed');
speed.oninput = () => document.getElementById('speedv').textContent = speed.value + '%';

let url = null;
document.getElementById('synth').onclick = () => {
  const text = document.getElementById('text').value;
  aq.select(sel.value);
  const wav = aq.synthe(text, Number(speed.value));
  const log = document.getElementById('log');
  if (!wav) { log.textContent = `error ${aq.lastError}`; return; }
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(new Blob([wav], { type: 'audio/wav' }));
  document.getElementById('audio').src = url;
  document.getElementById('save').disabled = false;
  log.textContent = `${sel.value}: ${wav.length} bytes`;
};
document.getElementById('save').onclick = () => {
  const a = document.createElement('a');
  a.href = url;
  a.download = `${sel.value}.wav`;
  a.click();
};
</script>
</body>
</html>
