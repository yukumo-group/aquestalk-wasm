<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AquesTalk10 — raw WebAssembly demo</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115; --card: #171a21; --fg: #e8eaed; --muted: #9aa4b2;
    --accent: #7cc4ff; --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font: 15px/1.5 system-ui, sans-serif;
    color: var(--fg); background: radial-gradient(1200px 600px at 20% -10%, #1b2a44, var(--bg));
    display: flex; justify-content: center; padding: 40px 16px;
  }
  main { width: min(760px, 100%); }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .02em; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  textarea {
    width: 100%; min-height: 110px; resize: vertical; padding: 12px 14px;
    border-radius: 10px; border: 1px solid var(--border); background: #0d1016; color: var(--fg);
    font: inherit; line-height: 1.6;
  }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 14px; }
  label { color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
  select, input[type=range] { accent-color: var(--accent); }
  select {
    background: #0d1016; color: var(--fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font: inherit;
  }
  .slider { display: flex; align-items: center; gap: 8px; }
  .slider output { min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; color: var(--fg); }
  .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 18px;
    border: 1px solid transparent; cursor: pointer; background: var(--accent); color: #06111c;
  }
  button.secondary { background: transparent; color: var(--fg); border-color: var(--border); }
  button:disabled { opacity: .45; cursor: default; }
  .status { margin-top: 14px; color: var(--muted); font-size: 13px; min-height: 1.4em; }
  .status.error { color: #ff8f8f; }
  audio { width: 100%; margin-top: 16px; }
  code { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>AquesTalk10 → WebAssembly</h1>
  <p class="sub">Recompiled from the original x86-64 machine code (no emulation, no Emscripten). Evaluation version: ナ行/マ行 become ヌ.</p>

  <section class="card">
    <textarea id="text" spellcheck="false">こんにちは。これわ、ごーせー/お'んせーです。</textarea>

    <div class="row">
      <label>声種
        <select id="voice">
          <option value="F1">F1 — 女声</option>
          <option value="F2">F2 — 女声</option>
          <option value="F3">F3 — 女声（高め）</option>
          <option value="M1">M1 — 男声</option>
          <option value="M2">M2 — 男声</option>
          <option value="R1">R1 — ロボット</option>
          <option value="R2">R2 — ロボット</option>
        </select>
      </label>
      <label>話速 <span class="slider"><input id="spd" type="range" min="50" max="300" value="100"><output id="spdOut">100</output></span></label>
      <label>音量 <span class="slider"><input id="vol" type="range" min="0" max="300" value="100"><output id="volOut">100</output></span></label>
    </div>

    <div class="actions">
      <button id="play" disabled>合成して再生</button>
      <button id="download" class="secondary" disabled>WAV をダウンロード</button>
    </div>
    <div id="status" class="status">wasm を読み込み中…</div>
    <audio id="audio" controls></audio>
  </section>
</main>

<script type="module">
import { AquesTalk10, VOICES, AquesTalkError } from './aqtk10.js';

const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const playBtn = $('play');
const dlBtn = $('download');
const audio = $('audio');
let tts = null;
let lastWav = null;
let lastUrl = null;

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', isError);
}

function currentVoice() {
  const v = { ...VOICES[$('voice').value] };
  v.spd = Number($('spd').value);
  v.vol = Number($('vol').value);
  return v;
}

function updateOutputs() {
  $('spdOut').textContent = $('spd').value;
  $('volOut').textContent = $('vol').value;
}
$('spd').addEventListener('input', updateOutputs);
$('vol').addEventListener('input', updateOutputs);
updateOutputs();

for (const [id, on] of [['play', true], ['download', false]]) {
  $(id).addEventListener('click', async () => {
    if (!tts) return;
    const text = $('text').value;
    if (!text.trim()) { setStatus('音声記号列が空です。', true); return; }
    playBtn.disabled = dlBtn.disabled = true;
    try {
      const t0 = performance.now();
      const wav = tts.synthe(text, currentVoice());
      const ms = performance.now() - t0;
      lastWav = wav;
      const blob = new Blob([wav], { type: 'audio/wav' });
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(blob);
      audio.src = lastUrl;
      if (on) { try { await audio.play(); } catch (_) {} }
      dlBtn.disabled = false;
      const secs = (wav.length - 44) / 2 / 16000;
      setStatus(`OK — ${wav.length.toLocaleString()} bytes, ${secs.toFixed(2)} s, ${ms.toFixed(1)} ms`);
      if (!on) {
        const a = document.createElement('a');
        a.href = lastUrl; a.download = 'aqtk10.wav'; a.click();
      }
    } catch (e) {
      setStatus(e instanceof AquesTalkError ? `エラー ${e.code}: ${e.message}` : String(e), true);
    } finally {
      playBtn.disabled = dlBtn.disabled = false;
    }
  });
}

try {
  tts = await AquesTalk10.load('./aqtk10.wasm');
  setStatus('準備完了 — テキストを入力して「合成して再生」を押してください。');
  playBtn.disabled = false;
} catch (e) {
  setStatus(`wasm の読み込みに失敗しました: ${e}`, true);
}
</script>
</body>
</html>
